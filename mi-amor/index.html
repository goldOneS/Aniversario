<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Para ti — una carta</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Una carta de amor, escrita para ti." />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=Mrs+Saint+Delafield&family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
  <link rel="icon" type="image/jpg" href="img/1.jpg">
</head>
<body>

  <!-- pétalos ambientales -->
  <div id="petals" class="petals-container" aria-hidden="true"></div>

  <div class="desk">

    <!-- estampilla / cuenta regresiva -->
    <aside class="ticket" id="ticket">
      <span class="ticket-label">próximo aniversario</span>
      <span class="ticket-num" id="countdown-num">—</span>
      <span class="ticket-sub">días</span>
    </aside>

    <main class="letter" id="letter">

      <header class="letter-head">
        <p class="dateline" id="dateline"></p>
        <p class="salutation">Querida mi amor,</p>
      </header>

<section class="photo-block">
    <figure class="polaroid">
      <img src="img/1.jpg" alt="Nosotros dos, en un momento cualquiera" />
      <figcaption>nosotros, en algún momento cualquiera</figcaption>
    </figure>
    <h1 class="tiempo-juntos" id="titulo-amor" aria-live="polite"></h1>
  </section>

  <!-- resto del contenido -->

  <script>
    function ponerImagenAleatoria() {
      const totalImagenes = 10;
      const numero = Math.floor(Math.random() * totalImagenes) + 1;
      const rutaImagen = `img/${numero}.jpg`;

      const img = document.querySelector(".polaroid img");
      img.src = rutaImagen;
      img.alt = `Nosotros dos, en un momento cualquiera (${numero})`;
    }

    document.addEventListener("DOMContentLoaded", ponerImagenAleatoria);
  </script>

      <hr class="fold" />

      <section class="poema-block">
        <p class="eyebrow">para ti</p>
        <p id="poema" class="poema">Cargando unas palabras para ti…</p>
      </section>

      <hr class="fold" />

      <section class="razones-block">
        <p class="eyebrow">un motivo cada vez</p>

        <button id="seal-btn" class="wax-seal" type="button" aria-label="Romper el sello para leer una razón para amarte">
          <svg viewBox="0 0 120 120" class="wax-seal-svg" xmlns="http://www.w3.org/2000/svg">
            <path class="wax-blob" d="M60 6c7 0 10 8 17 9s15-6 20 0 -2 15 3 21 13 6 13 13-10 9-13 15 5 15 0 21-15-1-20 0-9 9-16 9-10-8-17-9-15 6-20 0 2-15-3-21-13-6-13-13 10-9 13-15-5-15 0-21 15 1 20 0 9-9 13-9z"/>
            <text x="60" y="70" text-anchor="middle" class="wax-glyph">&amp;</text>
          </svg>
        </button>
        <p class="seal-hint">rompe el sello</p>

        <div id="razon-card" class="razon-card" hidden>
          <p id="razon-texto"></p>
        </div>
      </section>

      <hr class="fold" />

      <section class="buzon-block">
        <p class="eyebrow">buzón sincero</p>
        <p class="subtexto">
          Escribe aquí lo que sientas, sin miedo ni filtros. Siempre lo voy a leer con cariño.
        </p>

        <form id="buzonForm" class="buzon-form">
          <textarea
            id="mensaje"
            placeholder="Escribe aquí tu mensaje sincero, pensamiento o deseo…"
            required
          ></textarea>
          <button type="submit" class="btn-enviar">Enviar</button>
          <p id="status" class="estado-envio" role="status"></p>
        </form>
      </section>

      <footer class="letter-foot">
        <p class="despedida">Con todo mi amor,</p>
        <p class="firma">tu persona favorita</p>
      </footer>

    </main>

  </div>

  <script src="scripts.js"></script>
</body>
</html>
